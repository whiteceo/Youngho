<!doctype html>
<html><head><meta charset="utf-8"><title>ProcessSteps</title></head>
<body>
<div class="mg-pad" style="padding:28px"><div class="mg-steps" style="width:720px">
<div class="mg-step mg-step--done"><div class="mg-step__h">1단계 · 착수</div><div class="mg-step__row"><span class="mg-dia"></span></div><div class="mg-step__d">현황 진단과 범위 확정</div></div>
<div class="mg-step mg-step--done"><div class="mg-step__h">2단계 · 설계</div><div class="mg-step__row"><span class="mg-dia"></span></div><div class="mg-step__d">목표 모델 설계</div></div>
<div class="mg-step mg-step--now"><div class="mg-step__h">3단계 · 구축</div><div class="mg-step__row"><span class="mg-dia"></span></div><div class="mg-step__d">파일럿 구축</div></div>
<div class="mg-step"><div class="mg-step__h">4단계 · 검증</div><div class="mg-step__row"><span class="mg-dia"></span></div><div class="mg-step__d">성과 측정</div></div>
<div class="mg-step"><div class="mg-step__h">완료</div><div class="mg-step__row"><span class="mg-dia"></span></div><div class="mg-step__d">전사 확산</div></div>
</div></div>
</body></html>
